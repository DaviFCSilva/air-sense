name: CI

# Roda a cada push e pull request:
#  - compila o firmware para ESP32 (garante que o código no repositório compila)
#  - roda os testes da API
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar o core ESP32 e as bibliotecas
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # Lê as bibliotecas de libraries.txt (ignora comentários e linhas vazias)
          grep -v '^\s*#' firmware/airsense/libraries.txt | sed '/^\s*$/d' | while read -r lib; do
            arduino-cli lib install "$lib"
          done

      - name: Compilar (sem secrets.h)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default firmware/airsense

      - name: Compilar (com secrets.h de exemplo)
        run: |
          cp firmware/airsense/secrets.example.h firmware/airsense/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default firmware/airsense

  api:
    name: API (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest -v
